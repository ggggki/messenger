<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>termux Messenger</title>
  <style>
    body { margin:0; font-family:sans-serif; display:flex; height:100vh; }
    .sidebar { width:30%; background:#f0f0f0; border-right:1px solid #ccc; display:flex; flex-direction:column; }
    .chat-area { flex:1; display:flex; flex-direction:column; }
    .header { padding:10px; background:#075e54; color:white; font-weight:bold; }
    .contact-list { flex:1; overflow-y:auto; }
    .contact { padding:12px; border-bottom:1px solid #ddd; cursor:pointer; }
    .contact:hover { background:#e0e0e0; }
    .messages { flex:1; padding:10px; overflow-y:auto; background:#ece5dd; }
    .msg { margin:5px 0; max-width:70%; padding:8px 12px; border-radius:20px; clear:both; }
    .msg.sent { float:right; background:#dcf8c6; }
    .msg.received { float:left; background:white; }
    .input-area { display:flex; padding:10px; background:#f0f0f0; }
    .input-area input { flex:1; padding:10px; border:1px solid #ccc; border-radius:20px; }
    .input-area button { margin-left:10px; padding:10px 20px; background:#075e54; color:white; border:none; border-radius:20px; }
    .login-box { width:300px; margin:100px auto; padding:20px; background:#f5f5f5; border-radius:10px; }
    .login-box input { width:100%; margin:10px 0; padding:10px; border:1px solid #ddd; border-radius:5px; }
    .add-contact-area { padding:10px; display:flex; }
    .add-contact-area input { flex:1; padding:8px; border:1px solid #ccc; border-radius:5px; }
    .add-contact-area button { margin-left:5px; padding:8px 15px; background:#075e54; color:white; border:none; border-radius:5px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
